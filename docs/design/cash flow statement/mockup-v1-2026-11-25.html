<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACME Cash Flow</title>
<meta name="description" content="Layout mock v1 (2026-11-25) of the ACME Cash Flow report, a QuickBooks Online cash flow statement replacement: headline, statement, drill panel levels 2-4, side-bar menu, glass pop-ups, light and dark themes, design-notes layer. Illustrative figures. Spec: .sync/acme cash flow/spec/Tab 1.md; rules: ADR-0019, ADR-0012.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tokens: neutral frame = docs/design/design-requirements.md §2; identity accent = "Cash teal" (this report only) */
:root{
  --font:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --page:#D9DEE5; --ground:#F2F4F7; --surface:#FFFFFF; --subtle:#F6F8FA; --hover:#F1F4F7;
  --ink:#101B2B; --ink2:#2B3748; --muted:#4F5C6C; --faint:#8592A3;
  --line:#DEE3E9; --line2:#EDF0F3; --rule:#CDD4DC; --hair:#6F7B8B;
  --acc:#0F6E73; --accT:#E2F0F0; --accI:#0B5A5E; --onAcc:#FFFFFF;
  --in:#3461C9; --out:#DD7A33; --nbar:#A9B3C0; --tbar:#56647A; --shade:#EEF1F5;
  --ok:#1D7A4C; --okB:#3BA37B; --okT:#E3F2EA; --warn:#8A5A00; --warnB:#D9A441; --warnT:#FBF4E4; --bad:#B42318; --badT:#FCE8E6;
  --glass:rgba(255,255,255,.66); --glassSolid:rgba(255,255,255,.95); --glassLine:rgba(205,212,220,.95); --glassTop:rgba(255,255,255,.95);
  --shadow:0 14px 36px rgba(16,27,43,.18); --scrim:rgba(16,27,43,.06); --pin:#D6336C;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#04070B; --ground:#0C121A; --surface:#131A24; --subtle:#18202C; --hover:#1B2431;
  --ink:#E6EBF2; --ink2:#C9D2DE; --muted:#9AA6B5; --faint:#6B7889;
  --line:#243040; --line2:#1C2532; --rule:#334052; --hair:#8C98A8;
  --acc:#4FB8BC; --accT:rgba(79,184,188,.15); --accI:#86D5D8; --onAcc:#05201F;
  --in:#7EA2F2; --out:#F0A061; --nbar:#4A5668; --tbar:#9AA8BC; --shade:#1A2330;
  --ok:#5CC48E; --okB:#3FA873; --okT:rgba(92,196,142,.14); --warn:#E8B85A; --warnB:#D9A441; --warnT:rgba(232,184,90,.14); --bad:#F2877E; --badT:rgba(242,135,126,.14);
  --glass:rgba(19,26,36,.70); --glassSolid:rgba(19,26,36,.96); --glassLine:rgba(255,255,255,.10); --glassTop:rgba(255,255,255,.07);
  --shadow:0 18px 44px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.22); --pin:#FF6B9A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#04070B; --ground:#0C121A; --surface:#131A24; --subtle:#18202C; --hover:#1B2431;
  --ink:#E6EBF2; --ink2:#C9D2DE; --muted:#9AA6B5; --faint:#6B7889;
  --line:#243040; --line2:#1C2532; --rule:#334052; --hair:#8C98A8;
  --acc:#4FB8BC; --accT:rgba(79,184,188,.15); --accI:#86D5D8; --onAcc:#05201F;
  --in:#7EA2F2; --out:#F0A061; --nbar:#4A5668; --tbar:#9AA8BC; --shade:#1A2330;
  --ok:#5CC48E; --okB:#3FA873; --okT:rgba(92,196,142,.14); --warn:#E8B85A; --warnB:#D9A441; --warnT:rgba(232,184,90,.14); --bad:#F2877E; --badT:rgba(242,135,126,.14);
  --glass:rgba(19,26,36,.70); --glassSolid:rgba(19,26,36,.96); --glassLine:rgba(255,255,255,.10); --glassTop:rgba(255,255,255,.07);
  --shadow:0 18px 44px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.22); --pin:#FF6B9A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4}
body{padding:0 0 24px}
button{font:inherit;color:inherit}
.num,td,.v{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* mock chrome (outside the product frame) */
.chrome{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;font-size:12px;color:var(--muted)}
.chrome b{color:var(--ink);font-weight:600}
.sw{margin-left:auto;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-weight:500}
.sw input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--rule);position:relative;margin:0;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked{background:var(--pin)}
.sw input:checked::after{transform:translateX(14px)}

/* frame: 1440 x 810, 16:9 */
.frame{position:relative;width:min(1440px,100%);height:810px;margin:0 auto;background:var(--ground);display:grid;grid-template-columns:56px minmax(0,1fr);overflow:hidden;box-shadow:0 14px 36px rgba(16,27,43,.2)}
.sb{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.mark{width:34px;height:34px;border-radius:9px;background:var(--acc);color:var(--onAcc);font-weight:700;font-size:15px;display:grid;place-items:center;margin-bottom:10px;position:relative}
.mark small{position:absolute;right:3px;bottom:0;font-size:8.5px;font-weight:600}
.ib{width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--muted);position:relative;display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{background:var(--line2);color:var(--ink)}
.ib[aria-expanded="true"]{background:var(--accT);color:var(--accI)}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:3px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--acc);color:var(--onAcc);font-size:10px;font-weight:700;line-height:16px;text-align:center}
.badge[hidden]{display:none}
.sb .sp{flex:1}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{min-width:0;display:grid;grid-template-rows:52px 78px 658px;row-gap:0;padding:0 16px 12px}
.hdr{display:flex;align-items:center;gap:14px;min-width:0}
.hdr h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.ctx{margin:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.status:hover{border-color:var(--rule);background:var(--hover)}
.status .st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.status .st i{width:8px;height:8px;border-radius:50%}
.st.ok{color:var(--ok)} .st.ok i{background:var(--okB)}
.st.warn{color:var(--warn)} .st.warn i{background:var(--warnB)}
.status .sep{width:1px;height:14px;background:var(--line)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.tile .tb{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:1px;width:100%;height:100%;padding:8px 12px 8px 14px;border-radius:12px;cursor:pointer}
.tile .tb:hover{background:var(--hover)}
.tile .tb:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tile .tl{font-size:12px;font-weight:500;color:var(--muted);padding-right:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.tile .d{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.tile .d b{color:var(--ink);font-weight:600}
.tile .i{position:absolute;top:8px;right:8px}
.tile.close{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.tile.close .tb{background:var(--accT)}
.tile.close .v{color:var(--accI)}
.i{width:20px;height:20px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);font-size:11px;font-weight:600;font-style:normal;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:none;line-height:1}
.i:hover{border-color:var(--acc);color:var(--accI)}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:12px;margin-top:10px;min-height:0;height:648px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{display:flex;align-items:center;gap:8px;min-height:26px;flex:none}
.ch h2{font-size:14px;font-weight:600;margin:0;white-space:nowrap}
.ch .sp{flex:1}
.lgd{display:flex;gap:10px;font-size:11.5px;color:var(--muted);align-items:center}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.lgd i.ln{height:2px;width:12px;border-radius:1px;vertical-align:3px;background:var(--ink)}
.vl{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;border:1px solid var(--line);background:var(--subtle);font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.vl:hover{border-color:var(--acc);color:var(--accI)}
.vl svg{width:13px;height:13px}

/* statement table */
.stmt{padding:10px 0 0}
.stmt .ch{padding:0 14px 6px}
.tw{flex:1;min-height:0;overflow:auto;border-radius:0 0 12px 12px}
table.st{width:100%;min-width:620px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13.5px}
.st col.cn{width:104px} .st col.cc{width:94px} .st col.cp{width:78px} .st col.cs{width:68px}
.st thead{position:sticky;top:0;z-index:3}
.st thead th{background:var(--surface);font-size:11.5px;font-weight:600;color:var(--muted);text-align:right;padding:6px 12px 6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
.st td{height:26px;padding:0 12px 0 8px;text-align:right;white-space:nowrap;background:var(--surface)}
.st td.l{text-align:left;padding-left:calc(14px + var(--d,0) * 16px);padding-right:6px}
.lw{display:flex;align-items:center;gap:6px;min-width:0}
.lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dr{margin-left:auto;flex:none;color:var(--acc);opacity:0;font-size:15px;line-height:1;transition:opacity .12s}
tr.nav{cursor:pointer}
tr.nav:hover td{background:var(--hover)}
tr.nav:hover .dr,tr.nav:focus-visible .dr,tr.sel .dr{opacity:1}
tr.nav:focus-visible{outline:none}
tr.nav:focus-visible td{box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
tr.sel td{background:var(--accT)!important}
tr.sel td.l{box-shadow:inset 3px 0 0 var(--acc)}
td.cmp{color:var(--muted)}
tr.k-sec td{height:32px;padding-top:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr.k-sub td{font-weight:500}
.tg{all:unset;display:inline-flex;align-items:center;gap:6px;cursor:pointer;max-width:100%;min-width:0;border-radius:4px}
.tg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tg svg{width:12px;height:12px;flex:none;transition:transform .15s;color:var(--faint)}
.tg[aria-expanded="false"] svg{transform:rotate(-90deg)}
tr.k-subtot td,tr.k-tot td{height:30px;font-weight:600;border-top:1px solid var(--hair)}
tr.k-tot td{height:32px}
tr.k-memoh td{height:32px;padding-top:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr.k-memo td{color:var(--muted);font-style:italic}
tr.k-memo td.l{font-style:italic}
.st tfoot{position:sticky;bottom:0;z-index:3}
.st tfoot td{background:var(--surface)}
tr.k-grand td{height:34px;font-size:14.5px;font-weight:600;border-top:1px solid var(--hair);box-shadow:0 -10px 10px -10px rgba(16,27,43,.18)}
tr.k-begin td{height:28px}
tr.k-end td{height:36px;font-size:15px;font-weight:600;border-top:3px double var(--hair)}
.ovr{all:unset;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1px solid var(--acc);color:var(--accI);flex:none;cursor:help}
.ovr svg{width:11px;height:11px}
@keyframes flash{from{background:var(--accT)}to{background:var(--surface)}}
tr.flash td{animation:flash 1.4s ease-out}

/* charts column + drill panel */
.right{position:relative;min-width:0;min-height:0}
.charts{height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr) auto;gap:10px}
.charts .card svg{display:block;width:100%;height:100%;flex:1;min-height:0}
.cbank svg{height:auto!important;flex:none!important}
svg text{font-family:var(--font);font-variant-numeric:tabular-nums}
.t-lab{font-size:11px;fill:var(--muted)}
.t-val{font-size:11.5px;font-weight:600;fill:var(--ink)}
.t-ax{font-size:10px;fill:var(--faint)}
.b-in{fill:var(--in)} .b-out{fill:var(--out)} .b-tot{fill:var(--tbar)} .b-n{fill:var(--nbar)}
.b-shade{fill:var(--shade)}
.g-line{stroke:var(--line);stroke-width:1} .g-zero{stroke:var(--hair);stroke-width:1}
.conn{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.brk{stroke:var(--surface);stroke-width:3}
.ln-net{fill:none;stroke:var(--ink);stroke-width:2}
.soft{fill-opacity:.72}
.dot-net{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.hb{fill:var(--surface)} .hl{stroke:var(--nbar);stroke-width:2.2}
.uf-ex{fill:none;stroke:var(--faint);stroke-dasharray:3 2}
.hit{fill:transparent;cursor:pointer}
.hit:focus-visible{outline:none;stroke:var(--acc);stroke-width:2}
g.mk{cursor:pointer}
g.mk:hover rect.bar,g.mk:focus-visible rect.bar{filter:brightness(1.08)}
g.mk:focus-visible{outline:none}
g.mk:focus-visible rect.bar{stroke:var(--acc);stroke-width:2}

.panel{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;transform:translateX(24px);opacity:0;visibility:hidden;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .2s;z-index:5}
.panel.on{transform:none;opacity:1;visibility:visible;transition:transform .2s cubic-bezier(.2,.8,.2,1),opacity .2s}
.ph{display:flex;align-items:center;gap:6px;padding:8px 10px 6px;border-bottom:1px solid var(--line2);flex:none}
.ph .ib{width:30px;height:30px;border-radius:8px}
.ph .ib svg{width:16px;height:16px}
.crumbs{display:flex;align-items:center;gap:4px;min-width:0;flex:1;font-size:12px;color:var(--muted);overflow:hidden}
.crumbs button{all:unset;flex:0 1 auto;min-width:24px;cursor:pointer;color:var(--accI);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;border-radius:4px}
.crumbs button:hover{text-decoration:underline}
.crumbs button:focus-visible{outline:2px solid var(--acc)}
.crumbs .cur{flex:0 1 auto;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:40px}
.crumbs .cur:focus{outline:none}
.crumbs .gt{color:var(--faint);flex:none}
.lvl{display:flex;gap:3px;flex:none;margin:0 4px}
.lvl i{width:10px;height:4px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--acc)}
.pb{flex:1;min-height:0;overflow:auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:12px}
.pt{display:flex;align-items:baseline;gap:10px}
.pt h3{font-size:16px;font-weight:600;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt .amt{margin-left:auto;font-size:18px;font-weight:600;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--subtle);border-radius:10px;padding:8px 12px}
.trio span{display:block;font-size:11.5px;color:var(--muted)}
.trio b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.trio.sm b{font-size:14px}
.trio .k-in{box-shadow:inset 0 3px 0 var(--in)} .trio .k-out{box-shadow:inset 0 3px 0 var(--out)}
.sec-h{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;gap:8px;align-items:center}
.bars{display:flex;flex-direction:column;gap:1px}
.brow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:172px minmax(0,1fr) 92px;align-items:center;gap:10px;height:23px;padding:0 6px;border-radius:6px;font-size:12.5px;cursor:pointer}
.brow:hover{background:var(--hover)}
.brow:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .tr{height:10px;position:relative;background:var(--line2);border-radius:2px}
.brow .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--in)}
.brow.o .tr i{background:var(--out)}
.brow.oth .nm{color:var(--muted)}
.brow.oth .tr i{opacity:.5}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
.empty{display:grid;place-items:center;gap:8px;padding:40px 0;color:var(--muted);font-size:13px;text-align:center}
.empty svg{width:36px;height:36px;color:var(--faint)}
.pm svg{display:block;width:100%;height:auto}

/* level 3 */
.l3bar{display:flex;align-items:center;gap:10px}
.srch{flex:1;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.srch svg{width:15px;height:15px;color:var(--faint);flex:none}
.srch input{all:unset;flex:1;font-size:13px;color:var(--ink);min-width:0}
.srch:focus-within{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.lgw{flex:0 1 auto;min-height:0;overflow:auto;border:1px solid var(--line2);border-radius:10px}
table.lg{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
.lg col.c1{width:52px} .lg col.c2{width:98px} .lg col.c3{width:92px} .lg col.c4{width:56px} .lg col.c6,.lg col.c7{width:72px} .lg col.c8{width:28px}
.lg thead{position:sticky;top:0;z-index:2}
.lg th{background:var(--subtle);font-weight:600;color:var(--muted);font-size:11px;text-align:left;padding:7px 6px;white-space:nowrap;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.lg th.n{text-align:right}
.lg th[aria-sort="ascending"]::after{content:" ↑"} .lg th[aria-sort="descending"]::after{content:" ↓"}
.lg th.in{box-shadow:inset 0 -3px 0 var(--in)} .lg th.out{box-shadow:inset 0 -3px 0 var(--out)}
.lg td{padding:0 6px;height:26px;border-bottom:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.lg td.n{text-align:right}
.lg td.m{color:var(--muted)}
.lg tbody tr{cursor:pointer}
.lg tbody tr:hover td{background:var(--hover)}
.lg tbody tr:focus-visible{outline:none}
.lg tbody tr:focus-visible td{box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
.lg tfoot{position:sticky;bottom:0;z-index:2}
.lg tfoot td{background:var(--subtle);font-weight:600;border-bottom:0;border-top:1px solid var(--hair);height:28px}
.lg tfoot tr+tr td{border-top:0}
.sx{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:9.5px;font-weight:700}
.sx.R{background:var(--ink2);color:var(--surface)} .sx.C{border:1.5px solid var(--ink2);color:var(--ink2)} .sx.U{border:1.5px dashed var(--faint)}

/* level 4 */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;margin:0}
.fields div{min-width:0}
.fields dt{font-size:11px;color:var(--muted)}

let REG={};
function model(){
  const m=structuredClone(S.view==='ind'?IND:DIR);
  if(S.cash==='bank'){
    if(S.view==='ind')m[0].items[1].items.push({id:'uf',label:'Receipts not yet deposited',v:[-7240,3200],pool:'customers',wc:{side:'A',open:18700}});
    else m[0].items[0].v=[479680,455500];
  }
  return m;
}
const val=(n,i)=>n.items?n.items.reduce((a,c)=>a+val(c,i),0):n.v[i];
const leaves=n=>n.items?n.items.flatMap(leaves):[n];
function roll(m){
  const secs=m.filter(s=>!s.memo);const net=[0,1].map(i=>secs.reduce((a,s)=>a+val(s,i),0));
  const open=OPEN[S.cash];return{secs,net,open,close:[open[0]+net[0],open[1]+net[1]]};
}
function flatten(m){
  REG={};const out=[];
  for(const sec of m){
    const lv=leaves(sec);const pos=lv.reduce((a,l)=>a+Math.max(l.v[0],0),0),neg=lv.reduce((a,l)=>a+Math.min(l.v[0],0),0);
    const reg=(key,n,kind,label,parent)=>{REG[key]={key,n,kind,label:label||n.label,cur:val(n,0),cmp:val(n,1),sec,parent};return key};
    const shr=l=>sec.memo||l.v[0]===0?null:l.v[0]/(l.v[0]>0?pos:neg);
    const secOpen=!S.collapsed.has(S.view+':'+sec.id);
    out.push({k:sec.memo?'memoh':'sec',d:0,key:reg(sec.id,sec,sec.memo?'memoh':'sec'),sec});
    for(const it of sec.items){
      if(it.items){
        const sk=reg(sec.id+'/'+it.id,it,sec.memo?'memo':'sub');const subOpen=!S.collapsed.has(S.view+':'+sk);
        if(secOpen)out.push({k:sec.memo?'memo':'sub',d:1,key:sk,sec,grp:true});
        for(const l of it.items){const key=reg(sec.id+'/'+it.id+'/'+l.id,l,'leaf',null,it);if(secOpen&&subOpen)out.push({k:sec.memo?'memo':'leaf',d:2,key,sec,share:shr(l)})}
        if(!sec.memo){const key=reg(sec.id+'/'+it.id+'/tot',it,'sub',it.total);if(secOpen)out.push({k:'subtot',d:1,key,sec})}
      }else{const key=reg(sec.id+'/'+it.id,it,'leaf');if(secOpen)out.push({k:sec.memo?'memo':'leaf',d:1,key,sec,share:shr(it)})}
    }
    if(!sec.memo)out.push({k:'tot',d:0,key:reg(sec.id+'/tot',sec,'sec',sec.total),sec});
  }
  const r=roll(m);
  REG.grand={key:'grand',kind:'grand',label:'Net cash increase for period',cur:r.net[0],cmp:r.net[1],sec:{id:'roll',label:'Roll-forward'}};
  REG.begin={key:'begin',kind:'begin',label:'Cash at beginning of period',cur:r.open[0],cmp:r.open[1],sec:{id:'roll',label:'Roll-forward'}};
  REG.end={key:'end',kind:'end',label:'Cash at end of period',cur:r.close[0],cmp:r.close[1],sec:{id:'roll',label:'Roll-forward'}};
  return out;
}

/* ---------- pop-ups (glass) ---------- */
let popOpener=null;
function openPop(html,cls,opener,place){
  closeTip();const pop=$('#pop'),fr=$('#frame');
  pop.className='pop '+(cls||'');pop.innerHTML=html+'<button class="x" type="button" data-close aria-label="Close">✕</button>';
  pop.hidden=false;$('#scrim').hidden=false;popOpener=opener||null;
  pop.style.left=pop.style.top=pop.style.right=pop.style.bottom='';
  if(cls!=='menu'){
    const fw=fr.clientWidth,fh=fr.clientHeight,pw=pop.offsetWidth,ph=pop.offsetHeight;let x=(fw-pw)/2,y=Math.max(8,(fh-ph)/2);
    if(opener&&place!=='center'){const fb=fr.getBoundingClientRect(),ob=opener.getBoundingClientRect();
      x=ob.left-fb.left;y=ob.bottom-fb.top+8;if(place==='right'){x=ob.right-fb.left+10;y=ob.top-fb.top}
      if(place==='endalign')x=ob.right-fb.left-pw;
      if(x+pw>fw-8)x=fw-8-pw;if(y+ph>fh-8)y=Math.max(8,ob.top-fb.top-ph-8);if(y+ph>fh-8)y=Math.max(8,fh-8-ph)}
    pop.style.left=Math.max(8,x)+'px';pop.style.top=Math.max(8,y)+'px'}
  if(opener&&opener.hasAttribute('aria-expanded'))opener.setAttribute('aria-expanded','true');
  const f=pop.querySelector('[data-first]')||pop.querySelector('button:not(.x),input,[tabindex="0"]')||pop.querySelector('.x');f.focus({preventScroll:true});
}
function closePop(){const pop=$('#pop');if(pop.hidden)return false;pop.hidden=true;pop.innerHTML='';$('#scrim').hidden=true;
  $$('[aria-expanded="true"]').forEach(b=>{if(b.id==='sbMenu'||b.id==='sbHow'||b.id==='sbExport'||b.id==='status')b.setAttribute('aria-expanded','false')});
  const o=popOpener;popOpener=null;if(o&&document.contains(o))o.focus({preventScroll:true});return true}

 ['#frame','br',[-24,-24],'Build mapping','Power BI: one 1440 × 810 page; tiles = card visuals, bridge = waterfall, monthly = column + line combo, statement = matrix, Level 2 = bookmark panel, Levels 3–4 = drillthrough pages, menu = bookmark slicer pane, ⓘ = tooltip pages, glass → solid panels. JS app: same regions as components over Parquet + engine; URL carries period, view, filters and drill path.']];
function placePins(){
  const pins=$('#pins');if(pins.hidden)return;const fr=$('#frame').getBoundingClientRect();
  const tw=$('#tw').getBoundingClientRect();
  pins.innerHTML=NOTES.map((n,i)=>{let el=$(n[0]);let corner=n[1],off=n[2];if(!el)return'';let b=el.getBoundingClientRect();
    if(el.closest('#tw')&&(b.top<tw.top+30||b.bottom>tw.bottom-100)){el=$('#stmt');corner='tr';off=[-56,22];b=el.getBoundingClientRect()}
    let x=corner.includes('r')?b.right:b.left,y=corner.includes('b')?b.bottom:corner==='l'||corner==='r'?b.top+b.height/2:b.top;
    x+=off[0]-fr.left;y+=off[1]-fr.top;x=Math.max(14,Math.min(fr.width-14,x));y=Math.max(14,Math.min(fr.height-14,y));
    return `<button class="pin" type="button" data-note="${i}" style="left:${x}px;top:${y}px" aria-label="Design note ${i+1}: ${esc(n[3])}">${i+1}</button>`}).join('');
}
function setNotes(on){$('#pins').hidden=!on;$('#frame').classList.toggle('noting',on);const sw=$('#notesSw');sw.checked=on;sw.setAttribute('aria-checked',String(on));if(on)placePins()}

/* ---------- events ---------- */
function scrollToSec(id){
  const tw=$('#tw');let row;
  if(['begin','grand','end'].includes(id))row=$(`#tbl tr[data-key="${id}"]`);
  else{if(S.collapsed.delete(S.view+':'+id)){persist();renderStatement()}row=$(`#tbl tr[data-sec="${id}"]`)}
  if(!row)return;
  if(row.closest('tbody'))tw.scrollTo({top:Math.max(0,row.offsetTop-$('#tbl thead').offsetHeight),behavior:'smooth'});
  const rows=row.closest('tfoot')?[row]:$$(`#tbl tbody tr[data-sec="${id}"]`);
  rows.forEach(r=>{r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')});
  (row.matches('[data-nav]')?row:row.querySelector('[data-nav]')||row).focus({preventScroll:true});
}
function persist(){try{localStorage.setItem('acf-collapsed',JSON.stringify([...S.collapsed]))}catch(e){/* storage unavailable: state stays in memory */}}
function act(a,el){const [k,v]=a.split(':');if(k==='l2')openL2(v,el)}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#scrim')){closePop();return}
  const pin=t.closest('[data-note]');if(pin){const n=NOTES[+pin.dataset.note];openPop(`<h3><span class="pn">${+pin.dataset.note+1}</span>${esc(n[3])}</h3><p>${esc(n[4])}</p>`,'note',pin,'right');return}
  if(t.closest('[data-close]')){closePop();return}
  const inf=t.closest('[data-info]');if(inf){openPop(infoHtml(inf.dataset.info),'',inf);return}
  if(t.closest('#sbMenu')){openPop(menuHtml(),'menu',$('#sbMenu'));return}
  if(t.closest('#viewLbl')){openPop(menuHtml(),'menu',$('#viewLbl'));const mv=$('#mv');mv.scrollIntoView({block:'center'});mv.focus();return}
  if(t.closest('#sbHow')){openPop(howHtml(),'mid',$('#sbHow'),'right');return}
  if(t.closest('#sbExport')){openPop(exportHtml(),'',$('#sbExport'),'right');return}
  if(t.closest('#status')){openPop(recHtml(),'wide',$('#status'),'endalign');return}
  if(t.closest('#sbTheme')){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('acf-theme',nx)}catch(err){/* ignore */}return}
  const set=t.closest('[data-set]');if(set){const k=set.dataset.set;let v=set.dataset.v;if(k==='scale')v=+v;S[k]=v;
    set.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===set)));
    if(['view','cash','scale'].includes(k)){if(k!=='scale'&&S.drill.length){S.drill=[];S.sel=null;closePanelSilently()}renderAll()}else renderCtx();return}
  const chip=t.closest('[data-chip]');if(chip&&!chip.disabled){const s=S[chip.dataset.chip];const v=chip.dataset.v;if(s.has(v)&&s.size>1)s.delete(v);else s.add(v);chip.setAttribute('aria-pressed',String(s.has(v)));renderCtx();return}
  if(t.closest('[data-reset]')){Object.assign(S,{period:'Month',cmp:'Prior period',cols:'Total',view:'ind',cash:'qbo',scale:1,cust:'',vend:''});S.bank=new Set(['op','pay','res','uf']);S.cls=new Set(['con','man','trn']);closePanelSilently();renderAll();const o=popOpener;closePop();openPop(menuHtml(),'menu',o);return}
  const exc=t.closest('[data-exc]');if(exc){const e2=EXC[+exc.dataset.exc];closePop();if(!$('#panel').classList.contains('on'))panelOpener=$('#status');S.drill=[{lv:4,exc:true,txn:e2.x}];S.sel=null;markSel();renderPanel();return}
  const gt=t.closest('[data-goto]');if(gt){closePop();if(S.view!=='ind'){S.view='ind';renderAll()}openL2(gt.dataset.goto,$('#status'));scrollToSec('fin');return}
  const tg=t.closest('[data-tg]');if(tg){const k=tg.dataset.tg;S.collapsed.has(k)?S.collapsed.delete(k):S.collapsed.add(k);persist();renderStatement();const nb=$(`[data-tg="${k}"]`);if(nb)nb.focus();return}
  if(t.closest('.ovr'))return;
  const tb=t.closest('.tile .tb');if(tb){scrollToSec(tb.dataset.go==='grand'?'grand':tb.dataset.go);return}
  const row=t.closest('#tbl tr.nav');if(row){openL2(row.dataset.key,row);return}
  const mk=t.closest('[data-act]');if(mk){act(mk.dataset.act,mk);return}
  const pb=t.closest('[data-pb]');if(pb){pb.dataset.pb==='back'?back():closePanel();return}
  const cr=t.closest('[data-crumb]');if(cr){const c=cr.dataset.crumb;if(c==='rec'){openPop(recHtml(),'wide',$('#status'),'endalign');return}
    if(c.startsWith('sec:')){openL2(c.slice(4));return}S.drill=S.drill.slice(0,+c+1);renderPanel();return}
  const bi=t.closest('[data-bi]');if(bi){const top=S.drill[S.drill.length-1];const it=top.bd.items[+bi.dataset.bi];
    if(it.go){openL2(it.go);markSel();return}S.drill.push({lv:3,item:it});renderPanel();return}
  const lr=t.closest('#l3b tr');if(lr){const g=REG[S.drill[0].key];const row=L3.rows.find(x=>x.id===lr.dataset.rid);
    /* S13 look-through demo: the first bill payment under Payments to suppliers also settles an equipment bill */
    const look=S.view==='dir'&&g.n&&g.n.id==='ps'&&row.type==='Bill payment'&&L3.rows.find(x=>x.type==='Bill payment')===row;
    S.drill.push({lv:4,txn:txn(g,row,look)});renderPanel();return}
});
function closePanelSilently(){const p=$('#panel');p.classList.remove('on');p.setAttribute('aria-hidden','true');$('#charts').removeAttribute('inert');S.drill=[];S.sel=null}
document.addEventListener('input',e=>{const f=e.target.closest('[data-txt]');if(f){S[f.dataset.txt]=f.value;renderCtx()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(closePop()){e.preventDefault();return}if(S.drill.length){e.preventDefault();back();return}}
  const pop=$('#pop');if(e.key==='Tab'&&!pop.hidden){const f=$$('button:not([disabled]),input,[tabindex="0"]',pop);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}return}
  const nav=e.target.closest&&e.target.closest('#tbl [data-nav]');
  if(nav&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const all=$$('#tbl [data-nav]');const i=all.indexOf(nav);const n=all[i+(e.key==='ArrowDown'?1:-1)];if(n){n.focus();n.scrollIntoView({block:'nearest'})}return}
  if(nav&&nav.tagName==='TR'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openL2(nav.dataset.key,nav);return}
  const lr=e.target.closest&&e.target.closest('#l3b tr');if(lr&&e.key==='Enter'){lr.click();return}
  if(lr&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const n=e.key==='ArrowDown'?lr.nextElementSibling:lr.previousElementSibling;if(n)n.focus();return}
  const g=e.target.closest&&e.target.closest('g[data-act],rect[data-act]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act(g.dataset.act,g)}
});
const tipSel='[data-tip],.ovr';
document.addEventListener('mouseover',e=>{const el=e.target.closest(tipSel);if(el)showTip(el,e)});
document.addEventListener('mousemove',e=>{const el=e.target.closest(tipSel);if(el&&!$('#tip').hidden)showTip(el,e)});
document.addEventListener('mouseout',e=>{const el=e.target.closest(tipSel);if(el&&!el.contains(e.relatedTarget))closeTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest(tipSel);if(el)showTip(el);else closeTip()});
$('#notesSw').addEventListener('change',e=>setNotes(e.target.checked));
window.addEventListener('resize',()=>{closeTip();placePins()});
$('#tw').addEventListener('scroll',()=>{closeTip();placePins()},{passive:true});

/* ---------- init (query params are mock-only review hooks) ---------- */
(function init(){
  try{const th=localStorage.getItem('acf-theme');if(th)document.documentElement.dataset.theme=th;const c=JSON.parse(localStorage.getItem('acf-collapsed')||'[]');if(Array.isArray(c))c.forEach(k=>S.collapsed.add(String(k)))}catch(e){/* storage unavailable */}
  const q=new URLSearchParams(location.search);
  if(q.get('theme')==='dark'||q.get('theme')==='light')document.documentElement.dataset.theme=q.get('theme');
  if(q.get('view')==='dir')S.view='dir';
  renderAll();
  const d=q.get('drill');
  if(d){const key=REG[q.get('key')]?q.get('key'):S.view==='dir'?'op/ps':'op/adj/ar';openL2(key);
    if(d==='l3'||d==='l4'){const b=$('[data-bi="0"]');if(b)b.click();if(d==='l4'){const r=$$('#l3b tr').find(x=>x.textContent.includes('Bill payment'))||$('#l3b tr');if(r)r.click()}}}
  if(q.get('pop')==='recon')$('#status').click();
  if(q.get('pop')==='menu')$('#sbMenu').click();
  if(q.get('pop')==='how')$('#sbHow').click();
  if(q.get('notes')==='1')setNotes(true);
})();
</script>
