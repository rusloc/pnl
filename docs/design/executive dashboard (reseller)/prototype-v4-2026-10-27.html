<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nordmark executive dashboard</title>
<meta name="description" content="Nordmark Retail executive dashboard prototype v4: three hero numbers, nine explanation tiles in two sizes, status-washed cards with tall 13-week bars, an overall-status dot, a 56 px side bar with a frosted slide-out filter menu that conceals cards in place, frosted pop-ups with plain-English metric explanations and drill paths. DRAFT for USER approval; illustrative Week 43 data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens: flat minimal, one accent (cobalt #2048C6, 7.2:1 on white) ===== */
:root{
  --bg:#FFFFFF; --ink:#111827; --muted:#5F6878; --line:#E5E7EB; --line2:#F1F3F5; --soft:#F6F7F9;
  --acc:#2048C6; --accT:#EAEFFB;
  --good:#136C3A; --goodT:#E1F0E5; --watch:#9A5B00; --watchT:#FBEFD6; --off:#C0272D; --offT:#FAE3E3;
  --col:#D1D5DB; --tgt:#9CA3AF;
  --mix2:#374151; --mix3:#B6BCC6;
  --glass:rgba(255,255,255,.62); --glass-b:rgba(255,255,255,.78); --glass-hi:rgba(255,255,255,.9);
  --r:16px; --sb:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--bg)}
body{font-family:"Inter","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
h2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* ===== side bar (56 px, flat) ===== */
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px;z-index:30}
.sb .mark{width:32px;height:32px;border-radius:9px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sb .ib{width:40px;height:40px;border-radius:12px;border:1px solid transparent;position:relative;color:var(--muted)}
.sb .ib:hover{border-color:var(--line);color:var(--ink)}
.sb .ib[aria-expanded="true"]{background:var(--accT);color:var(--acc);border-color:transparent}
.sb .ib svg{width:20px;height:20px;display:block;margin:0 auto}
.sb .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--acc);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center}
.sb .sp{flex:1}
.sb .draft{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--watch);padding:6px 0}

/* ===== page ===== */
.page{margin-left:var(--sb);padding:14px 24px 16px;min-height:100vh}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.top .brand small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.top .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-left:18px;border-left:1px solid var(--line)}
.top .meta b{color:var(--ink);font-weight:600}
.top .rf{margin-left:auto;font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 6px;font-size:13px;color:var(--muted)}
.cnt{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-weight:600;font-size:12px}
.cnt.good{background:var(--goodT);color:var(--good)} .cnt.watch{background:var(--watchT);color:var(--watch)} .cnt.off{background:var(--offT);color:var(--off)}
.status .sen{padding-left:12px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status .sen b{color:var(--off);font-weight:600}
.status .sum{margin-left:auto;font-size:12px;white-space:nowrap}
.status .sum b{color:var(--ink);font-weight:500}

/* ===== grids and cards: 6 columns, three sizes (hero · med · sm) ===== */
section{margin-top:10px}
section>h2{margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:11px 16px 11px;background:var(--bg);display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:opacity .2s,filter .2s}
.card.hero{grid-column:span 2;height:236px}
.card.med{grid-column:span 2;height:176px}
.card.sm{grid-column:span 1;height:168px}
/* status wash: white on the left → pale status colour at 50 % alpha on the right (tokens in README) */
.card.good{background:linear-gradient(90deg,#FFFFFF 0%,rgba(184,222,196,.5) 100%)}
.card.watch{background:linear-gradient(90deg,#FFFFFF 0%,rgba(255,211,160,.5) 100%)}
.card.off{background:linear-gradient(90deg,#FFFFFF 0%,rgba(243,201,197,.5) 100%)}
/* concealed in place by a filter: keeps its slot, no reflow */
.card.dim{opacity:.08;filter:grayscale(1);pointer-events:none}
.ch{display:flex;align-items:center;gap:8px;flex:none}
.ch h3{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .ch h3{font-size:14.5px}
.ch h3 span{font-weight:400;color:var(--muted)}
.sm .ch h3 span{display:none}
.st{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;cursor:default}
.st.good{background:var(--goodT);color:var(--good)} .st.watch{background:var(--watchT);color:var(--watch)} .st.off{background:var(--offT);color:var(--off)}
.sm .st{width:22px;padding:0;justify-content:center}
.cb{display:flex;justify-content:space-between;align-items:stretch;gap:10px;flex:1;min-height:0}
.cl{display:flex;flex-direction:column;min-width:0}
.val{font-size:30px;font-weight:600;line-height:36px;letter-spacing:-.02em;white-space:nowrap}
.hero .val{font-size:44px;line-height:48px}
.sm .val{font-size:26px;line-height:32px}
.val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.delta{font-size:12.5px;font-weight:600;line-height:18px;white-space:nowrap;margin-top:2px}
.hero .delta{font-size:13.5px}
.sm .delta{white-space:normal;font-size:12px;line-height:16px}
.good .delta{color:var(--good)} .watch .delta{color:var(--watch)} .off .delta{color:var(--off)}
.acts2{margin-top:auto;display:flex;gap:4px;padding-top:6px}
.ib{width:28px;height:28px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.6)}
.ib:hover{border-color:var(--acc);color:var(--acc)}
.ib.i{font-family:Georgia,serif;font-style:italic}
svg.spark{display:block;overflow:visible;flex:none}
.card svg.spark{width:260px;height:100%;align-self:stretch}
.med svg.spark{width:180px}
.sm svg.spark{width:88px}
svg.spark rect{fill:var(--col)} svg.spark rect.cur{fill:var(--ink)}
.good svg.spark rect.cur{fill:var(--good)} .watch svg.spark rect.cur{fill:var(--watch)} .off svg.spark rect.cur{fill:var(--off)}
svg.spark path{fill:none;stroke:var(--tgt);stroke-width:1;stroke-dasharray:2 2}
svg.spark text{font-size:9px;fill:var(--muted);font-family:inherit}
svg.spark text.cur{fill:var(--ink);font-weight:600}
.mixv{width:28px;align-self:stretch;flex:none;display:flex;flex-direction:column;border-radius:999px;overflow:hidden;gap:2px}
.mixv i{display:block;width:100%} .mixv .a{background:var(--acc)} .mixv .b{background:var(--mix2)} .mixv .c{background:var(--mix3)}
.mixbar{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;width:240px;flex:none;margin-bottom:12px}
.mixbar i{display:block;height:100%} .mixbar .a{background:var(--acc)} .mixbar .b{background:var(--mix2)} .mixbar .c{background:var(--mix3)}
/* overall-status dot before the pills */
.dot{width:14px;height:14px;border-radius:999px;flex:none;position:relative;cursor:default}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid currentColor;opacity:0;animation:pulse 2s ease-out infinite}
.dot.green{background:#2E9E5B;color:#2E9E5B} .dot.orange{background:#E3A52A;color:#E3A52A} .dot.red{background:#B3261E;color:#B3261E}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}

/* ===== frosted glass (menu, pop-ups, drawer, tooltip) ===== */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-b);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(17,24,39,.16)}
.chip{height:28px;padding:0 12px;border:1px solid rgba(17,24,39,.14);border-radius:999px;font-size:12.5px;font-weight:500;color:var(--muted);background:rgba(255,255,255,.45);display:inline-flex;align-items:center;gap:6px;transition:border-color .12s,background .12s,color .12s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--acc);border-color:rgba(32,72,198,.45);background:rgba(32,72,198,.12);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:inset 0 1px 0 var(--glass-hi)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(255,255,255,.92)}
  .chip[aria-pressed="true"]{background:#E6ECFA}
}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.22);z-index:40}
.menu{position:fixed;left:calc(var(--sb) + 10px);top:10px;bottom:10px;width:min(360px,calc(100vw - var(--sb) - 20px));padding:18px 20px 16px;overflow:auto;z-index:50}
.menu .mh{display:flex;align-items:center;gap:10px}
.menu .mh h2{font-size:16px;font-weight:600;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.menu .mh .x{margin-left:auto}
.menu .mh .reset{height:28px;padding:0 12px;border:1px solid rgba(17,24,39,.14);border-radius:999px;font-size:12px;font-weight:500;color:var(--muted);background:rgba(255,255,255,.45)}
.menu .mh .reset:hover{border-color:var(--ink);color:var(--ink)}
.menu .hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.menu .gh{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;align-items:baseline;gap:8px}
.menu .gh span{font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.menu .gh.sec{margin-top:22px;padding-top:14px;border-top:1px solid rgba(17,24,39,.08)}
.menu .chips{display:flex;flex-wrap:wrap;gap:6px}
.x{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);flex:none;background:rgba(255,255,255,.5)}
.x:hover{color:var(--ink);border-color:var(--ink)}
.pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 32px));max-height:min(86vh,820px);overflow:auto;padding:22px 24px 20px;z-index:50}
.pop-h{display:flex;align-items:flex-start;gap:12px}
.pop-h .eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop-h h2{font-size:18px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--ink);margin-top:2px}
.pop-h .word{margin-left:auto;font-size:14px;font-weight:600;white-space:nowrap;padding-top:14px}
.pop-h .word.good{color:var(--good)} .pop-h .word.watch{color:var(--watch)} .pop-h .word.off{color:var(--off)}
.pop-v{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:14px}
.pop-v .big{font-size:48px;font-weight:600;line-height:52px;letter-spacing:-.03em;white-space:nowrap}
.pop-v .big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.pop-v .delta{font-size:13.5px;margin-top:4px}
.pop-v svg.spark{width:240px;height:72px}
.pop-v .mixbar{width:240px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(17,24,39,.08)}
.stats div{font-size:12px;color:var(--muted)}
.stats div b{display:block;font-size:15px;font-weight:600;color:var(--ink);margin-top:2px}
.body{margin-top:14px;display:grid;grid-template-columns:118px 1fr;gap:8px 14px;font-size:13px;line-height:1.5}
.body dt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.body dd b{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:11px;font-weight:500;color:var(--muted);border:1px solid rgba(17,24,39,.14);border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.4)}
.tag b{color:var(--ink);font-weight:600}
.pop-f{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(17,24,39,.08);font-size:12.5px;color:var(--muted)}
.pop-f b{color:var(--ink);font-weight:500}
.pill{margin-top:12px;width:100%;height:40px;border-radius:999px;border:1px solid rgba(32,72,198,.45);background:rgba(32,72,198,.10);color:var(--acc);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.pill:hover{background:rgba(32,72,198,.16)}
.pill .n{width:22px;height:22px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.steps{counter-reset:s;margin:14px 0 0;list-style:none;display:flex;flex-direction:column;gap:10px}
.steps li{position:relative;padding-left:38px;font-size:13px;line-height:1.5}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.steps li b{display:block;font-weight:600}
.steps li.last::before{background:var(--mix2)}
.pop ul.plain{margin:12px 0 0 18px;font-size:13px;line-height:1.55}
.pop ul.plain li{margin-bottom:6px}
.pop h4{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.pop p{font-size:13px;line-height:1.5}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:5px 8px 5px 0;border-bottom:1px solid rgba(17,24,39,.12)}
table.t td{padding:4px 8px 4px 0;border-bottom:1px solid rgba(17,24,39,.07);vertical-align:top}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));padding:22px 22px 18px;overflow:auto;z-index:50}
.drawer h2{font-size:18px;font-weight:600;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.drawer .dom{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.drawer .bk{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-top:1px solid rgba(17,24,39,.08);font-size:12.5px}
.drawer .bk div{flex:1;min-width:0}
.drawer .bk b{font-weight:600;display:block}
.drawer .bk span{color:var(--muted)}
.drawer .bk .o{flex:none;font-size:11px;font-weight:600;color:var(--muted);border:1px solid rgba(17,24,39,.14);border-radius:999px;padding:1px 8px;white-space:nowrap;margin-top:1px}
.tip{position:fixed;z-index:60;max-width:280px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--ink);border-radius:12px;pointer-events:none}
.tip b{font-weight:600}

@media (max-width:1200px){.grid{grid-template-columns:repeat(2,1fr)}.card.hero,.card.med,.card.sm{grid-column:span 1;height:auto;min-height:176px}.sm .ch h3 span{display:inline}.sm .st{width:auto;padding:0 9px}.card svg.spark,.med svg.spark,.sm svg.spark{width:38%}.top .rf{margin-left:0}}
@media (max-width:720px){.grid{grid-template-columns:1fr}.page{padding:12px 14px}.top .meta{border-left:0;padding-left:0}.stats{grid-template-columns:1fr 1fr}.body{grid-template-columns:1fr}.status .sum{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.dot::after{display:none}}
</style>
</head>
<body>

<nav class="sb" aria-label="Side bar">
  <div class="mark" aria-hidden="true">N</div>
  <button class="ib" id="sb-filters" aria-haspopup="dialog" aria-expanded="false" aria-label="Filters and switchers" data-tip="<b>Filters</b> · period, comparator, region and the metric attributes"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h14M5.5 10h9M8 15h4"/></svg><span class="badge" id="sb-badge" hidden>0</span></button>
  <button class="ib" id="sb-how" aria-haspopup="dialog" aria-expanded="false" aria-label="How to read" data-tip="<b>How to read</b> this page"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M7.8 8a2.2 2.2 0 1 1 3.1 2c-.7.4-.9.8-.9 1.5"/><circle cx="10" cy="14.2" r=".6" fill="currentColor"/></svg></button>
  <button class="ib" id="sb-more" aria-haspopup="dialog" aria-expanded="false" aria-label="More KPIs, 20 on the bench" data-tip="<b>More KPIs</b> · 20 bench metrics, inactive"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><path d="M14 12v4M12 14h4"/></svg></button>
  <button class="ib" id="sb-notes" aria-haspopup="dialog" aria-expanded="false" aria-label="Notes for the owner" data-tip="<b>Notes</b> · status rules, data contract, corrections vs v1"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h7l4 4v10H5z"/><path d="M12 3v4h4M7.5 10.5h5M7.5 13.5h5"/></svg></button>
  <span class="sp"></span>
  <span class="draft" aria-label="Draft v4, projection state">Draft v4</span>
</nav>

<div class="page">
  <header class="top">
    <div class="brand"><h1>Nordmark Retail</h1><small>Executive dashboard</small></div>
    <div class="meta"><span id="m-period"><b>Week 43</b> · 19–25 Oct 2026</span><span id="m-compare">vs <b>Budget</b></span><span id="m-region">All regions &amp; formats</span></div>
    <span class="rf">Refreshed Mon 26 Oct 05:12</span>
  </header>

  <div class="status">
    <span class="dot" id="dot" tabindex="0" role="img" aria-label="Overall status"></span>
    <span class="cnt good">▲ 7 on track</span><span class="cnt watch">● 3 watch</span><span class="cnt off">▼ 2 off track</span>
    <span class="sen"><b>Off track:</b> Availability 94.1%, Markdown 9.8% of sales.</span>
    <span class="sum" id="sum" aria-live="polite"></span>
  </div>

  <section aria-labelledby="h-t1"><h2 id="h-t1">The three numbers</h2><div class="grid" id="g-t1"></div></section>
  <section aria-labelledby="h-t2"><h2 id="h-t2">What explains them</h2><div class="grid" id="g-t2"></div></section>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="menu glass" id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title" hidden></aside>
<div class="pop glass" id="pop" role="dialog" aria-modal="true" aria-labelledby="pop-title" hidden></div>
<aside class="drawer glass" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<div class="tip glass" id="tip" role="tooltip" hidden></div>

<script>
/* ===================== data ===================== */
const ATTRS=[

function spark(m,W,H,labels,stretch){
  if(m.kind==='mix'){
    if(stretch)return `<div class="mixv" aria-hidden="true"><i class="a" style="height:${m.mix[0]}%"></i><i class="b" style="height:${m.mix[1]}%"></i><i class="c" style="height:${m.mix[2]}%"></i></div>`;
    return `<div class="mixbar" aria-hidden="true"><i class="a" style="width:${m.mix[0]}%"></i><i class="b" style="width:${m.mix[1]}%"></i><i class="c" style="width:${m.mix[2]}%"></i></div>`}
  const p=m.pts,t=m.tgt,n=p.length,g=2,bw=(W-g*(n-1))/n,lab=labels?12:0,base=H-lab;
  let lo=Math.min(...p,t),hi=Math.max(...p,t);const r=(hi-lo)||1;lo-=r*0.6;hi+=r*0.15;
  const y=v=>base-(v-lo)/(hi-lo)*base;let h='';
  p.forEach((v,i)=>{const x=i*(bw+g);h+=`<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(base-y(v)).toFixed(1)}" rx="1"${i===n-1?' class="cur"':''}/>`;
    if(labels&&(i%3===0||i===n-1))h+=`<text x="${(x+bw/2).toFixed(1)}" y="${H}" text-anchor="middle"${i===n-1?' class="cur"':''}>W${31+i}</text>`});
  h+=`<path d="M0 ${y(t).toFixed(1)} H${W}"/>`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"${stretch?' preserveAspectRatio="none"':''} aria-hidden="true">${h}</svg>`;
}

    <div class="cb">
      <div class="cl"><div class="val">${m.value}<small>${m.unit}</small></div><div class="delta">${m.delta}</div>

}

  const n=M.length,off=M.filter(m=>m.status==='off').length,watch=M.filter(m=>m.status==='watch').length,good=M.filter(m=>m.status==='good').length;
  const pc=x=>Math.round(100*x/n)+'%';
  const R={redOff:1/3,orangeWatchOff:0.5,greenGood:2/3};   /* thresholds as given; with 7/3/2 the result is orange (7/12 = 58% < 2/3) */
  let col;
  if(off/n>=R.redOff)col='red';else if((watch+off)/n>R.orangeWatchOff)col='orange';else if(good/n>=R.greenGood)col='green';else col='orange';
  const d=$('#dot');d.classList.add(col);
  d.setAttribute('aria-label',`Overall status ${col}`);
  d.dataset.tip=`<b>Overall: ${col}</b> · computed over all ${n} cards, filters ignored. Red if off track ≥ 1/3 · else orange if watch + off track > 50% · else green if on track ≥ 2/3 · else orange. Now: off track ${off} (${pc(off)}), watch + off ${watch+off} (${pc(watch+off)}), on track ${good} (${pc(good)}).`;
})();

/* ===================== filters (state lives here; the menu renders it) ===================== */
const sel={};ATTRS.forEach(a=>sel[a[0]]=new Set());
function applyFilter(){
  let shown=0;const total=M.length;
  document.querySelectorAll('.card').forEach(el=>{
    const m=byId[el.dataset.id];
    const ok=ATTRS.every(a=>sel[a[0]].size===0||sel[a[0]].has(m.tags[a[0]]));
    el.classList.toggle('dim',!ok);                 /* concealed in place: slot and position are kept */
    if(ok){el.removeAttribute('inert');el.removeAttribute('aria-hidden');shown++}
    else{el.setAttribute('inert','');el.setAttribute('aria-hidden','true')}
  });
  const picked=[];let n=0;
  ATTRS.forEach(a=>{sel[a[0]].forEach(v=>{picked.push(LABEL[a[0]][v]);n++})});
  $('#sum').innerHTML=`<b>${shown} of ${total} metrics</b> · ${picked.length?picked.join(', '):'All'}`;
  const b=$('#sb-badge');b.textContent=n;b.hidden=n===0;
  $('#sb-filters').setAttribute('aria-label',`Filters and switchers${n?`, ${n} active`:''}`);
}
function applyCtx(){
  SWITCH.forEach(s=>{const v=s[2].find(o=>o[0]===ctx[s[0]]);$('#m-'+s[0]).innerHTML=v[2]});
}
function menuHtml(){
  const chips=(attr,opts,cur)=>`<div class="chips">${opts.map(v=>`<button class="chip" data-attr="${attr}" data-val="${v[0]}" aria-pressed="${cur(v[0])}">${v[1]}</button>`).join('')}</div>`;
  return `<div class="mh"><h2 id="menu-title">Filters</h2><button class="reset" id="reset">Reset</button><button class="x" aria-label="Close">×</button></div>
  <div class="hint">Period, comparator and region re-label the header; the Δ values stay the Budget set in this prototype.</div>
  ${SWITCH.map(s=>`<div class="gh">${s[1]}</div>`+chips('ctx:'+s[0],s[2],v=>v===ctx[s[0]])).join('')}
  <div class="gh sec">Metric attributes <span>OR within a group · AND across groups</span></div>
  ${ATTRS.map(a=>`<div class="gh">${a[1]}</div>`+chips(a[0],a[2],v=>sel[a[0]].has(v))).join('')}`;
}
applyFilter();applyCtx();

/* ===================== layers (one at a time) ===================== */
let opener=null,openEl=null;
const menu=$('#menu'),pop=$('#pop'),drawer=$('#drawer'),scrim=$('#scrim'),tip=$('#tip');
const SBBTN={menu:'sb-filters',drawer:'sb-more'};
function openLayer(el,html,from){
  closeAll(false);
  opener=from||document.activeElement;openEl=el;
  el.innerHTML=html;el.hidden=false;scrim.hidden=false;hideTip();
  document.body.style.overflow='hidden';
  document.querySelectorAll('.sb .ib[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(opener&&opener.closest&&opener.closest('.sb'))opener.setAttribute('aria-expanded','true');
  const x=el.querySelector('.x');(x||el).focus();
}
function closeAll(restore=true){
  if(!openEl)return;
  openEl.hidden=true;scrim.hidden=true;openEl=null;document.body.style.overflow='';
  document.querySelectorAll('.sb .ib[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(restore&&opener&&opener.focus){opener.focus();hideTip()}
}
function head(eyebrow,title,word,status){
  return `<div class="pop-h"><div><div class="eyebrow">${eyebrow}</div><h2 id="pop-title">${title}</h2></div>${word?`<span class="word ${status}">${word}</span>`:''}<button class="x" aria-label="Close">×</button></div>`;
}
function explainHtml(m){
  return head(`${m.tier===1?'Tier 1':'Explains Tier 1'} · ${m.sub}`,m.title,WORD[m.status].slice(2),m.status)+
  `<div class="pop-v"><div><div class="big">${m.value}<small>${m.unit}</small></div><div class="delta" style="color:var(--${m.status})">${m.delta}</div></div>${spark(m,240,72,true)}</div>
   <div class="stats">${m.stats.map(s=>`<div>${s[0]}<b>${s[1]}</b></div>`).join('')}</div>
   <dl class="body"><dt>What it is</dt><dd>${m.what}</dd><dt>Why it matters</dt><dd>${m.why}</dd><dt>Formula</dt><dd>${m.formula}</dd><dt>Worked example</dt><dd>${m.example}</dd><dt>Status rule</dt><dd>${m.rule}</dd><dt>Owner note</dt><dd>${m.note}</dd></dl>
   ${tagsHtml(m)}
   <div class="pop-f"><span>${m.foot[0]}</span><span><b>${m.foot[1]}</b></span></div>
   <button class="pill" data-act="drill" data-id="${m.id}"><span class="n">↗</span>Drill path · ${PAGE[m.drill.page]}</button>`;
}
function drillHtml(m){
  return head(`Drill path · ${PAGE[m.drill.page]}`,m.title,WORD[m.status].slice(2),m.status)+
  `<ol class="steps">${m.drill.steps.map((s,i)=>`<li${i===m.drill.steps.length-1?' class="last"':''}><b>${s[0]}</b>${s[1]}</li>`).join('')}</ol>
   <div class="pop-f"><span>Carried on every click: period · region / format · comparator · the metric</span></div>
   <button class="pill" data-act="explain" data-id="${m.id}"><span class="n" style="font-family:Georgia,serif;font-style:italic">i</span>Back to the explanation</button>`;
}
function howHtml(){
  return head('Nordmark · Week 43','How to read this page','','')+
  `<ul class="plain">
    <li><b>Three numbers</b> carry the page: Net sales (sell more), Total margin % (keep more), Weeks of cover (turn stock faster). The nine tiles below explain them: card size follows importance, worst first.</li>
    <li><b>Status</b> is vs the metric’s target: ▲ On track · ● Watch · ▼ Off track; the card is washed in the status colour; hover a chip for the rule. The <b>Δ line</b> is vs the comparator in the header (Budget). The <b>dot</b> before the counts is the overall status over all 12 cards; hover it for the rule.</li>
    <li><b>Bars</b> = the last 13 retail weeks; the current week is in the status colour, the dotted line is the target.</li>
    <li><b>ⓘ</b> opens the plain-English explanation, a worked example and the owner’s note; <b>↗</b> opens the drill path to the drill page and its lowest grain.</li>
    <li><b>Side bar</b>: Filters (period, comparator, region and the metric attributes; inside one attribute a choice is OR, across attributes AND; filtered-out cards fade in place so nothing moves; the badge counts active choices; Reset clears), How to read, More KPIs (the 20 bench metrics, inactive), Notes.</li>
    <li><b>prov.</b> in a title = provisional until close (true-up 10 Nov). Illustrative data · EUR · NL + BE · LY = same retail week.</li>
  </ul>
  <div class="pop-f"><span>Draft v3 · nothing built</span><span><b>Refreshed Mon 26 Oct 05:12</b></span></div>`;
}
function notesHtml(){
  return head('For the owner','Notes','','')+
  `<h4>Status rules (vs target, independent of the comparator)</h4>
   <table class="t"><tbody>${M.map(m=>`<tr><td><b>${m.title}</b></td><td>${m.rule}</td></tr>`).join('')}</tbody></table>
   <h4>Where the margins meet</h4>
   <p>Front margin = Net sales − COGS at landed cost. Back margin = contract rate × qualifying purchases, accrued weekly, provisional until the monthly true-up. Total margin = front + back. Markdown already reduces the sell price, so it is shown as % of gross sales and never enters the margin sum twice. EBITDA = Total margin − shrink − store OpEx − central OpEx − fulfilment.</p>
   <h4>Data contract</h4>
   <ul class="plain">
     <li>Five facts: Sales (day × store/channel × SKU), Inventory snapshot (day × location × SKU, last snapshot), Purchases / receipts (PO line × receipt), Supplier income (contract × period), GL / OpEx (account × cost centre × period × scenario).</li>
     <li><b>LY week key</b> on the retail calendar (week 43 ↔ LY week 43, never same dates; 53-week year restated). <b>LFL flag</b> on the store, monthly (open ≥ 13 months, not refitted). <b>Provisional flag</b> on back margin and EBITDA flash until close.</li>
     <li>Executive model day × store × category (≤ 500 MB); SKU grain only behind a click; receipt, PO and GL lines in the domain models.</li>
   </ul>
   <h4>Number corrections vs v1</h4>
   <ul class="plain">
     <li>Stock incl. on-order €168m → €490m (11.4 wks × €43.0m forecast weekly COGS).</li>
     <li>GMROI inputs €411m ÷ €152m → €1,016m ÷ €376m (ratio 2.7× unchanged).</li>
     <li>Back margin €3.9m / 6.3% → €3.8m / 6.2%; channel shares → 68.4 / 19.9 / 11.7.</li>
     <li>Weeks-of-cover rule: On track ±1 wk · Watch 1–2 · Off beyond 2.</li>
   </ul>
   <div class="pop-f"><span>Open questions and build risks: README.md in this folder</span></div>`;
}
function drawerHtml(){
  return `<div class="pop-h"><div><div class="eyebrow">KPI bench · inactive, switched on per client</div><h2 id="drawer-title">More KPIs · 20</h2></div><button class="x" aria-label="Close">×</button></div>
  ${BENCH.map(d=>`<div class="dom">${d[0]}</div>`+d[1].map(k=>`<div class="bk"><div><b>${k[0]}</b><span>${k[1]}</span></div><span class="o">${k[2]}</span></div>`).join('')).join('')}`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){const m=byId[b.dataset.id];const from=openEl?opener:b;
    openLayer(pop,b.dataset.act==='explain'?explainHtml(m):drillHtml(m),from);return}
  const c=e.target.closest('.chip[data-attr]');
  if(c){const a=c.dataset.attr,v=c.dataset.val;
    if(a.startsWith('ctx:')){const k=a.slice(4);ctx[k]=v;menu.querySelectorAll(`.chip[data-attr="${a}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.val===v)));applyCtx()}
    else{const s=sel[a];if(s.has(v))s.delete(v);else s.add(v);c.setAttribute('aria-pressed',String(s.has(v)));applyFilter()}
    return}
  if(e.target.closest('#reset')){ATTRS.forEach(a=>sel[a[0]].clear());ctx.period='week';ctx.compare='budget';ctx.region='all';menu.innerHTML=menuHtml();applyFilter();applyCtx();menu.querySelector('#reset').focus();return}
  if(e.target.closest('.x')){closeAll();return}
  if(e.target===scrim){closeAll();return}
});
$('#sb-filters').addEventListener('click',e=>openLayer(menu,menuHtml(),e.currentTarget));
$('#sb-how').addEventListener('click',e=>openLayer(pop,howHtml(),e.currentTarget));
$('#sb-more').addEventListener('click',e=>openLayer(drawer,drawerHtml(),e.currentTarget));
$('#sb-notes').addEventListener('click',e=>openLayer(pop,notesHtml(),e.currentTarget));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&openEl){closeAll();return}
  if(e.key==='Tab'&&openEl){ /* keep focus inside the open layer */
    const f=[...openEl.querySelectorAll('button,[tabindex="0"],a[href]')].filter(x=>!x.hidden);if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}
  }
});

/* ===================== tooltip (status chips, side bar) ===================== */
function showTip(el){
  tip.innerHTML=el.dataset.tip;tip.hidden=false;
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x,y;
  if(el.closest('.sb')){x=r.right+10;y=r.top+r.height/2-h/2}
  else{x=r.right-w;y=r.bottom+8;if(y+h>window.innerHeight-8)y=r.top-h-8}
  if(x<8)x=8;if(y<8)y=8;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tip.hidden=true}
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t&&!openEl)showTip(t)});
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))hideTip()});
document.addEventListener('focusin',e=>{const t=e.target.closest('[data-tip]');if(t&&!openEl)showTip(t)});
document.addEventListener('focusout',e=>{if(e.target.closest('[data-tip]'))hideTip()});
</script>
</body>
</html>
